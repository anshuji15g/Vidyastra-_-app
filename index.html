<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidyastra - Study War 12th</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Animated Blobs -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Onboarding Screen -->
    <div id="onboarding-screen" class="screen-container">
        <div class="glass-card onboarding-card">
            <div class="brand-badge pulse-animation">
                <span class="avatar-icon animated-tutor">🤖</span>
                <span class="brand-title">Study War 12th</span>
            </div>
            <p class="brand-subtitle">Made by Ayushman</p>
            
            <h1 class="welcome-heading">Study War 12th में आपका स्वागत है!</h1>
            <p class="welcome-subtext">आपका शुभ नाम क्या है?</p>

            <div class="input-group">
                <input type="text" id="username-input" placeholder="अपना नाम यहाँ लिखें..." autocomplete="off">
            </div>

            <button id="start-btn" class="neon-btn">
                <span>शुरू करें</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="screen-container hidden">
        <!-- Header -->
        <header class="app-header glass-panel">
            <div class="header-left">
                <div class="brand-avatar animated-tutor">🤖</div>
                <div class="header-info">
                    <h2>Study War 12th</h2>
                    <span class="status-online"><i class="fa-solid fa-circle"></i> AI Tutor Offline Active</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-badge">
                    <span class="animated-user">👤</span>
                    <span id="display-username">विद्यार्थी</span>
                </div>
            </div>
        </header>

        <!-- Chat Box -->
        <main id="chat-box" class="chat-area"></main>

        <!-- Input Box & Search Bar -->
        <footer class="app-footer">
            <form id="search-form" class="search-box glass-panel">
                <input type="text" id="search-input" placeholder="यहाँ प्रश्न पूछें (जैसे: गॉस प्रमेय, राउल्ट नियम)..." autocomplete="off" required>
                <button type="submit" id="send-btn" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </footer>
    </div>

    <!-- Modular Knowledge Base Loading (Part 1 to Part 10) -->
    <script src="data_part1.js"></script>
    <script src="data_part2.js"></script>
    <script src="data_part3.js"></script>
    <script src="data_part4.js"></script>
    <script src="data_part5.js"></script>
    <script src="data_part6.js"></script>
    <script src="data_part7.js"></script>
    <script src="data_part8.js"></script>
    <script src="data_part9.js"></script>
    <script src="data_part10.js"></script>

    <!-- Core App Logic Engine -->
    <script src="app.js"></script>
</body>
        </html>
